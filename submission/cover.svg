<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">AI Innovation — Support, in your language</title>
  <desc id="description">AI Innovation is a bilingual Vietnamese and English voice-support assistant built with AssemblyAI real-time speech recognition.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#291642"/>
      <stop offset=".52" stop-color="#32184e"/>
      <stop offset="1" stop-color="#17102d"/>
    </linearGradient>
    <radialGradient id="glow">
