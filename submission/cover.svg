  <text x="112" y="386" fill="#fbf8ff" font-family="Arial, sans-serif" font-size="108" font-weight="700" letter-spacing="-5">Support,</text>
  <text x="112" y="504" fill="#fbf8ff" font-family="Arial, sans-serif" font-size="108" font-weight="700" letter-spacing="-5">in your language.</text>
  <text x="120" y="582" fill="#cbbfda" font-family="Arial, sans-serif" font-size="32">AI Innovation · Vietnamese ↔ English voice support</text>
