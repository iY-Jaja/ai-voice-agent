<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Innovation - Bilingual Voice Support</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: min(900px, 92vw);
            padding: 32px 0;
        }

        .card {
            background: #111827;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitle {
            margin: 0 0 24px;
            color: #94a3b8;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 11px 18px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover:not(:disabled) {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #stopButton {
            background: #dc2626;
        }

        #stopButton:hover:not(:disabled) {
            background: #b91c1c;
        }

        #interruptButton {
            background: #d97706;
        }

        #interruptButton:hover:not(:disabled) {
            background: #b45309;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 12px 14px;
            background: #0f172a;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #64748b;
        }

        .status-dot.connected {
            background: #22c55e;
        }

        .status-dot.recording {
            background: #ef4444;
        }

        .status-dot.processing {
            background: #f59e0b;
        }

        .status-dot.error {
            background: #ef4444;
        }

        #statusText {
            font-size: 14px;
        }

        .transcript {
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
            padding: 16px;
            background: #020617;
            border: 1px solid #334155;
            border-radius: 12px;
        }

        .message {
            margin-bottom: 16px;
        }

        .message:last-child {
            margin-bottom: 0;
        }

        .message-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 5px;
            color: #64748b;
        }

        .message.user .message-label {
            color: #60a5fa;
        }

        .message.assistant .message-label {
            color: #34d399;
        }

        .message.system .message-label {
            color: #fbbf24;
        }

        .message-text {
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .partial {
            opacity: 0.55;
            font-style: italic;
        }

        .metadata {
            margin-top: 18px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .metadata-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
        }

        .metadata-label {
            color: #64748b;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .metadata-value {
            font-family: monospace;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        :root {
            color-scheme: dark;
            font-family: "Space Grotesk", sans-serif;
            --ink: #f8f5ff;
            --muted: #b9aeca;
            --line: rgba(232, 216, 255, 0.16);
            --mint: #91f5d5;
            --amber: #f6c978;
        }

        body {
            min-height: 100svh;
            color: var(--ink);
            background-color: #211139;
            background-image:
                linear-gradient(rgba(239, 224, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(239, 224, 255, 0.035) 1px, transparent 1px),
                radial-gradient(ellipse at 16% 0%, #51277a 0%, transparent 48%),
                linear-gradient(135deg, #211139 0%, #32184e 48%, #17102d 100%);
            background-size: 48px 48px, 48px 48px, auto, auto;
        }

        .container {
            width: min(1320px, calc(100% - 80px));
            padding: 30px 0 24px;
        }

        .card {
            min-height: min(850px, calc(100svh - 60px));
            display: grid;
            grid-template-columns: minmax(0, 1.08fr) minmax(360px, 0.92fr);
            grid-template-rows: auto auto auto auto auto auto;
            column-gap: clamp(40px, 7vw, 112px);
            row-gap: 24px;
            align-content: center;
            padding: 0;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            animation: arrive 700ms ease-out both;
        }

        .card::before {
            content: "AI INNOVATION     /     VI ↔ EN CUSTOMER SUPPORT";
            grid-column: 1 / -1;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--line);
            color: #e9ddff;
            font: 11px "DM Mono", monospace;
            letter-spacing: 0.08em;
        }

        h1 {
            grid-column: 1;
            grid-row: 2;
            align-self: end;
            max-width: 650px;
            margin: 0;
            color: var(--ink);
            font-size: clamp(56px, 7.4vw, 96px);
            line-height: 0.96;
            font-weight: 500;
        }

        .subtitle {
            grid-column: 1;
            grid-row: 3;
            max-width: 410px;
            margin: 0;
            color: #d2c7e2;
            font-size: 16px;
            line-height: 1.55;
        }

        .controls {
            grid-column: 1;
            grid-row: 4;
            align-self: start;
            gap: 10px;
            margin: 6px 0 0;
        }

        button {
            min-height: 48px;
            border: 1px solid rgba(245, 237, 255, 0.2);
            border-radius: 999px;
            padding: 0 20px;
            color: var(--ink);
            background: rgba(28, 14, 48, 0.45);
            font: 600 14px "Space Grotesk", sans-serif;
            transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: rgba(245, 237, 255, 0.55);
        }

        button:disabled { opacity: 0.42; }

        #startButton {
            min-width: 150px;
            border-color: transparent;
            color: #211139;
            background: var(--mint);
        }

        #startButton:hover:not(:disabled) { background: #bcffe9; }
        #stopButton { color: #ffd5d5; background: rgba(28, 14, 48, 0.45); }
        #interruptButton { color: #ffe0a9; background: rgba(28, 14, 48, 0.45); }

        .status {
            grid-column: 1;
            grid-row: 5;
            align-self: start;
            gap: 9px;
            margin: 0 0 0 2px;
            padding: 0;
            border: 0;
            color: #d3c9e3;
            background: transparent;
        }

        #statusText { font-size: 13px; }
        .status-dot.connected { background: var(--mint); }
        .status-dot.recording { background: #ff8c9b; box-shadow: 0 0 14px rgba(255, 140, 155, 0.7); animation: pulse 1.2s ease-in-out infinite; }
        .status-dot.processing { background: var(--amber); }
        .status-dot.error { background: #ff7284; }

        .transcript {
            grid-column: 2;
            grid-row: 2 / 6;
            align-self: stretch;
            min-height: 340px;
            max-height: min(580px, calc(100svh - 200px));
            padding: 22px 4px 18px 26px;
            border: 0;
            border-left: 1px solid var(--line);
            border-radius: 0;
            background: transparent;
            scrollbar-color: rgba(213, 190, 255, 0.4) transparent;
        }

        .transcript:empty::before {
            content: "LIVE SESSION  /  Your conversation will appear here.";
            color: rgba(227, 216, 241, 0.58);
            font: 11px "DM Mono", monospace;
            letter-spacing: 0.04em;
        }

        .message { margin-bottom: 22px; animation: arrive 280ms ease-out both; }
        .message-label { margin-bottom: 7px; color: #b8a5d2; font: 700 10px "DM Mono", monospace; }
        .message.user .message-label { color: var(--mint); }
        .message.assistant .message-label { color: #c6adff; }
        .message.system .message-label { color: var(--amber); }
        .message-text { color: #f0eafa; font-size: 15px; line-height: 1.6; }
        .partial { color: #c9bdd8; }

        .metadata {
            grid-column: 1 / -1;
            grid-row: 6;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            margin: 0;
            padding-top: 18px;
            border-top: 1px solid var(--line);
            gap: 0;
        }

        .metadata-item {
            min-width: 0;
            padding: 0 18px;
            border: 0;
            border-left: 1px solid var(--line);
            border-radius: 0;
            background: transparent;
        }

        .metadata-item:first-child { padding-left: 0; border-left: 0; }
        .metadata-label { margin-bottom: 7px; color: #ae9bbc; font: 9px "DM Mono", monospace; }
        .metadata-value { color: #eee6f7; font: 11px "DM Mono", monospace; }

        @keyframes pulse { 50% { opacity: 0.48; } }
        @keyframes arrive {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 820px) {
            .container { width: min(calc(100% - 40px), 620px); padding-top: 20px; }
            .card {
                min-height: auto;
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto auto auto auto auto auto auto;
                row-gap: 18px;
                padding: 0;
            }
            .card::before { grid-row: 1; }
            h1 { grid-column: 1; grid-row: 2; font-size: clamp(54px, 12vw, 78px); }
            .subtitle { grid-column: 1; grid-row: 3; }
            .controls { grid-column: 1; grid-row: 4; }
            .status { grid-column: 1; grid-row: 5; }
            .transcript {
                grid-column: 1;
                grid-row: 6;
                min-height: 220px;
                max-height: 360px;
                padding: 18px 0;
                border-top: 1px solid var(--line);
                border-left: 0;
            }
            .metadata { grid-column: 1; grid-row: 7; grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 18px; }
            .metadata-item:nth-child(3) { padding-left: 0; border-left: 0; }
        }

        @media (max-width: 480px) {
            .container { width: calc(100% - 32px); padding-top: 16px; }
            .card::before { font-size: 9px; }
            h1 { font-size: clamp(48px, 14vw, 64px); }
            .subtitle { font-size: 14px; }
            .controls { gap: 8px; }
            button { min-height: 44px; padding: 0 14px; font-size: 12px; }
            #startButton { min-width: 128px; }
            .metadata-item { padding: 0 10px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 600px) {
            .card {
                padding: 20px;
            }

            .metadata {
                grid-template-columns: 1fr;
            }

            button {
                flex: 1;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <div class="card">
        <h1>Support, in your language.</h1>
        <p class="subtitle">First-line voice support in Vietnamese and English. Get safe troubleshooting and a clear handoff when a person is needed.</p>

        <div class="controls">
            <button id="startButton">Start conversation</button>
            <button id="stopButton" disabled>End</button>
            <button id="interruptButton" disabled>Interrupt</button>
        </div>

        <div class="status">
            <span id="statusDot" class="status-dot"></span>
            <span id="statusText">Disconnected</span>
        </div>

        <div id="transcript" class="transcript"></div>

        <div class="metadata">
            <div class="metadata-item">
                <div class="metadata-label">WebSocket</div>
                <div id="connectionState" class="metadata-value">Disconnected</div>
            </div>

            <div class="metadata-item">
                <div class="metadata-label">Audio Sample Rate</div>
                <div id="sampleRate" class="metadata-value">-</div>
            </div>

            <div class="metadata-item">
                <div class="metadata-label">Session ID</div>
                <div id="sessionId" class="metadata-value">-</div>
            </div>

            <div class="metadata-item">
                <div class="metadata-label">Agent State</div>
                <div id="agentState" class="metadata-value">Idle</div>
            </div>
        </div>
    </div>
</div>

<script>
"use strict";

/*
 * Audio is mono PCM16 at 24 kHz. The browser streams raw microphone
 * bytes to FastAPI; the server relays them to AssemblyAI and returns
 * sentence-sized Edge TTS PCM16 chunks as binary WebSocket messages.
 */

const SAMPLE_RATE = 24000;
const CHANNELS = 1;

let websocket = null;

let audioContext = null;
let mediaStream = null;
let sourceNode = null;
let processorNode = null;

let isRecording = false;
let sessionReady = false;

let playbackQueue = [];
let playbackTime = 0;

let partialUserMessage = null;
let partialAssistantMessage = null;

const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");
const interruptButton = document.getElementById("interruptButton");

const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");

const transcriptElement = document.getElementById("transcript");

const connectionStateElement =
    document.getElementById("connectionState");

const sampleRateElement =
    document.getElementById("sampleRate");

const sessionIdElement =
    document.getElementById("sessionId");

const agentStateElement =
    document.getElementById("agentState");

/* ============================================================
 * UI
 * ============================================================ */

function setStatus(text, state = "") {
    statusText.textContent = text;

    statusDot.className = "status-dot";
    if (state) {
        statusDot.classList.add(state);
    }
}
function setAgentState(state) {
    agentStateElement.textContent = state;
}

function appendMessage(role, text, partial = false) {
    const message = document.createElement("div");
    message.className = `message ${role}`;

    const label = document.createElement("div");
    label.className = "message-label";

    if (role === "user") {
        label.textContent = "You";
    } else if (role === "assistant") {
        label.textContent = "Assistant";
    } else {
        label.textContent = "System";
    }

    const content = document.createElement("div");
    content.className = "message-text";

    if (partial) {
        content.classList.add("partial");
    }

    content.textContent = text;

    message.appendChild(label);
    message.appendChild(content);

    transcriptElement.appendChild(message);
    transcriptElement.scrollTop = transcriptElement.scrollHeight;

    return message;
}

function updatePartialUserMessage(text) {
    if (!partialUserMessage) {
        partialUserMessage = appendMessage("user", text, true);
        return;
    }

    const content =
        partialUserMessage.querySelector(".message-text");

    content.textContent = text;
}

function finalizePartialUserMessage(text) {
    if (!partialUserMessage) {
        appendMessage("user", text);
        return;
    }

    const content =
        partialUserMessage.querySelector(".message-text");

    content.textContent = text;
    content.classList.remove("partial");

    partialUserMessage = null;
}

function updatePartialAssistantMessage(delta) {
    if (!partialAssistantMessage) {
        partialAssistantMessage = appendMessage(
            "assistant",
            delta,
            true,
        );
        return;
    }

    const content =
        partialAssistantMessage.querySelector(".message-text");

    content.textContent += delta;
}

function finalizePartialAssistantMessage(text) {
    if (!partialAssistantMessage) {
        if (text) {
            appendMessage("assistant", text);
        }
        return;
    }

    const content =
        partialAssistantMessage.querySelector(".message-text");

    content.textContent = text;
    content.classList.remove("partial");
    partialAssistantMessage = null;
}

function clearTranscript() {
    transcriptElement.innerHTML = "";
    partialUserMessage = null;
    partialAssistantMessage = null;
}


/* ============================================================
 * AudioContext
 * ============================================================ */

async function ensureAudioContext() {
    if (!audioContext) {
        audioContext = new AudioContext({
            sampleRate: SAMPLE_RATE
        });
    }

    if (audioContext.state === "suspended") {
        await audioContext.resume();
    }

    sampleRateElement.textContent =
        `${audioContext.sampleRate} Hz`;
}


/* ============================================================
 * PCM conversion
 * ============================================================ */

function floatTo16BitPCM(float32Array) {
    const output = new Int16Array(float32Array.length);

    for (let i = 0; i < float32Array.length; i++) {
        const sample = Math.max(
            -1,
            Math.min(1, float32Array[i])
        );

        output[i] =
            sample < 0
                ? sample * 0x8000
                : sample * 0x7FFF;
    }

    return output;
}


/*
 * Downsample browser microphone audio to 24 kHz.
 *
 * Browsers may ignore the requested AudioContext sample rate and
 * actually run the microphone pipeline at 48 kHz.
 */
function downsampleTo24kHz(
    input,
    inputSampleRate
) {
    if (inputSampleRate === SAMPLE_RATE) {
        return floatTo16BitPCM(input);
    }

    const sampleRateRatio =
        inputSampleRate / SAMPLE_RATE;

    const outputLength =
        Math.floor(input.length / sampleRateRatio);

    const output = new Float32Array(outputLength);

    let outputIndex = 0;
    let inputIndex = 0;

    while (outputIndex < outputLength) {
        const nextInputIndex =
            Math.min(
                Math.round(
                    (outputIndex + 1) * sampleRateRatio
                ),
                input.length
            );

        let sum = 0;
        let count = 0;

        for (
            let i = inputIndex;
            i < nextInputIndex;
            i++
        ) {
            sum += input[i];
            count++;
        }

        output[outputIndex] =
            count > 0
                ? sum / count
                : 0;

        outputIndex++;
        inputIndex = nextInputIndex;
    }

    return floatTo16BitPCM(output);
}


/* ============================================================
 * Microphone
 * ============================================================ */

async function startMicrophone() {
    await ensureAudioContext();

    mediaStream =
        await navigator.mediaDevices.getUserMedia({
            audio: {
                channelCount: CHANNELS,
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            }
        });

    const track =
        mediaStream.getAudioTracks()[0];

    console.log(
        "Microphone settings:",
        track.getSettings()
    );

    sourceNode =
        audioContext.createMediaStreamSource(
            mediaStream
        );

    /*
     * ScriptProcessorNode is deprecated but kept here because it
     * works without requiring a separate AudioWorklet file.
     *
     * For production, replace this with AudioWorklet.
     */
    processorNode =
        audioContext.createScriptProcessor(
            4096,
            1,
            1
        );

    processorNode.onaudioprocess =
        function(event) {
            if (!isRecording) {
                return;
            }

            if (!websocket) {
                return;
            }

            if (websocket.readyState !== WebSocket.OPEN) {
                return;
            }

            if (!sessionReady) {
                return;
            }

            const input =
                event.inputBuffer.getChannelData(0);

            const pcm16 =
                downsampleTo24kHz(
                    input,
                    audioContext.sampleRate
                );

            /*
             * Send raw PCM16 bytes to FastAPI.
             *
             * FastAPI then converts these bytes to base64 for
             * AssemblyAI's input.audio event.
             */
            websocket.send(pcm16.buffer);
        };

    /*
     * Connecting the processor to the destination keeps the
     * ScriptProcessorNode active in browsers.
     *
     * The gain is zero, so microphone audio is not played back.
     */
    const silentGain =
        audioContext.createGain();

    silentGain.gain.value = 0;

    sourceNode.connect(processorNode);
    processorNode.connect(silentGain);
    silentGain.connect(audioContext.destination);

    isRecording = true;

    setStatus("Recording", "recording");
    setAgentState("Listening");
}


/* ============================================================
 * Microphone cleanup
 * ============================================================ */

function stopMicrophone() {
    isRecording = false;

    if (processorNode) {
        processorNode.onaudioprocess = null;

        try {
            processorNode.disconnect();
        } catch (_) {}

        processorNode = null;
    }

    if (sourceNode) {
        try {
            sourceNode.disconnect();
        } catch (_) {}

        sourceNode = null;
    }

    if (mediaStream) {
        for (const track of mediaStream.getTracks()) {
            track.stop();
        }

        mediaStream = null;
    }
}


/* ============================================================
 * PCM playback
 * ============================================================ */

async function playPCMChunk(
    arrayBuffer,
    sampleRate = SAMPLE_RATE
) {
    await ensureAudioContext();

    if (!arrayBuffer || arrayBuffer.byteLength === 0) {
        return;
    }

    /*
     * PCM16 little-endian.
     */
    const pcm =
        new Int16Array(arrayBuffer);

    if (pcm.length === 0) {
        return;
    }

    const audioBuffer =
        audioContext.createBuffer(
            1,
            pcm.length,
            sampleRate
        );

    const channel =
        audioBuffer.getChannelData(0);

    for (let i = 0; i < pcm.length; i++) {
        channel[i] =
            pcm[i] / 32768;
    }

    const source =
        audioContext.createBufferSource();

    source.buffer = audioBuffer;
    source.connect(audioContext.destination);

    const now =
        audioContext.currentTime;

    /*
     * Never schedule audio in the past.
     */
    playbackTime =
        Math.max(
            playbackTime,
            now
        );

    source.start(playbackTime);

    playbackTime +=
        audioBuffer.duration;

    playbackQueue.push(source);

    source.onended = function() {
        const index =
            playbackQueue.indexOf(source);

        if (index !== -1) {
            playbackQueue.splice(index, 1);
        }
    };
}


/*
 * The backend streams sentence-sized TTS chunks as they are ready.
 *
 * When barge-in occurs, reply_done contains:
 *
 * {
 *     "status": "interrupted"
 * }
 *
 * At that point all queued audio must be discarded.
 */
function flushPlayback() {
    for (const source of playbackQueue) {
        try {
            source.stop();
        } catch (_) {}
    }

    playbackQueue = [];
    playbackTime = 0;
}


/* ============================================================
 * WebSocket
 * ============================================================ */

function getWebSocketURL() {
    const protocol =
        window.location.protocol === "https:"
            ? "wss:"
            : "ws:";

    return `${protocol}//${window.location.host}/ws/voice`;
}


function connectWebSocket() {
    return new Promise((resolve, reject) => {
        const url = getWebSocketURL();

        console.log(
            "Connecting to:",
            url
        );

        websocket =
            new WebSocket(url);

        /*
         * We need binary data for PCM audio.
         */
        websocket.binaryType = "arraybuffer";

        websocket.onopen = function() {
            console.log(
                "Connected to FastAPI"
            );

            connectionStateElement.textContent =
                "Connected";

            setStatus(
                "Connected",
                "connected"
            );

            startButton.disabled = true;
            stopButton.disabled = false;
            interruptButton.disabled = false;

            websocket.send(
                JSON.stringify({
                    type: "start"
                })
            );

            resolve();
        };

        websocket.onmessage =
            async function(event) {
                /* FastAPI forwards PCM16 speech as binary messages. */
                if (event.data instanceof ArrayBuffer) {
                    try {
                        await playPCMChunk(
                            event.data,
                            SAMPLE_RATE
                        );
                    } catch (error) {
                        console.error(
                            "Audio playback error:",
                            error
                        );
                    }

                    return;
                }

                /*
                 * Some browsers may provide Blob instead of
                 * ArrayBuffer depending on the WebSocket event.
                 */
                if (event.data instanceof Blob) {
                    try {
                        const arrayBuffer =
                            await event.data.arrayBuffer();

                        await playPCMChunk(
                            arrayBuffer,
                            SAMPLE_RATE
                        );
                    } catch (error) {
                        console.error(
                            "Blob playback error:",
                            error
                        );
                    }

                    return;
                }

                let message;

                try {
                    message =
                        JSON.parse(event.data);
                } catch (error) {
                    console.error(
                        "Invalid server JSON:",
                        event.data
                    );
                    return;
                }

                await handleServerEvent(message);
            };

        websocket.onerror =
            function(error) {
                console.error(
                    "WebSocket error:",
                    error
                );

                setStatus(
                    "WebSocket error",
                    "error"
                );

                reject(
                    new Error(
                        "WebSocket connection failed"
                    )
                );
            };

        websocket.onclose =
            function(event) {
                console.log(
                    "Disconnected:",
                    event.code,
                    event.reason
                );

                sessionReady = false;

                connectionStateElement.textContent =
                    "Disconnected";

                startButton.disabled = false;
                stopButton.disabled = true;
                interruptButton.disabled = true;

                setAgentState("Idle");

                if (event.code !== 1000) {
                    setStatus(
                        "Disconnected unexpectedly",
                        "error"
                    );
                } else {
                    setStatus(
                        "Disconnected"
                    );
                }
            };
    });
}


/* ============================================================
 * Server event handling
 * ============================================================ */

async function handleServerEvent(event) {
    console.log(
        "Event:",
        JSON.stringify(event)
    );

    switch (event.type) {
        case "session_started":
            console.log(
                "Session started:",
                event.session_id
            );

            sessionIdElement.textContent =
                event.session_id || "-";

            setAgentState(
                "Connecting to AssemblyAI"
            );

            break;


        case "session_ready":
            sessionReady = true;

            sessionIdElement.textContent =
                event.session_id || "-";

            console.log(
                "AssemblyAI ready:",
                event.session_id
            );

            setStatus(
                "Ready — speak now",
                "connected"
            );

            setAgentState(
                "Listening"
            );

            /*
             * Audio MUST NOT be sent before session.ready.
             */
            try {
                await startMicrophone();
            } catch (error) {
                console.error(
                    "Microphone error:",
                    error
                );

                appendMessage(
                    "system",
                    `Microphone error: ${error.message}`
                );

                stopSession();
            }

            break;


        case "speech_started":
            setAgentState(
                "User is speaking"
            );

            setStatus(
                "Listening",
                "recording"
            );

            break;


        case "speech_stopped":
            setAgentState(
                "Processing"
            );

            setStatus(
                "Processing",
                "processing"
            );

            break;


        case "transcript_partial":
            updatePartialUserMessage(
                event.text || ""
            );

            break;


        case "transcript":
            finalizePartialUserMessage(
                event.text || ""
            );

            break;


        case "llm_started":
            setAgentState(
                "Assistant is responding"
            );

            setStatus(
                "Assistant speaking",
                "processing"
            );

            break;


        case "assistant_text":
            finalizePartialAssistantMessage(
                event.text || "",
            );

            break;


        case "assistant_text_delta":
            updatePartialAssistantMessage(
                event.text || "",
            );

            break;


        case "reply_done":
            if (event.status === "error") {
                setAgentState("Error");
                setStatus("Response failed", "error");
                break;
            }

            if (
                event.status === "interrupted"
            ) {
                flushPlayback();

                setAgentState(
                    "Listening"
                );

                setStatus(
                    "Listening",
                    "recording"
                );
            } else {
                setAgentState(
                    "Listening"
                );

                setStatus(
                    "Ready — speak now",
                    "connected"
                );
            }

            break;


        case "interrupted":
            flushPlayback();

            setAgentState(
                "Listening"
            );

            break;


        case "session_ended":
            sessionReady = false;

            setAgentState(
                "Idle"
            );

            break;


        case "error":
            console.error(
                "Server error:",
                event
            );

            appendMessage(
                "system",
                event.message ||
                "Unknown server error"
            );

            setStatus(
                event.message ||
                "Error",
                "error"
            );

            setAgentState(
                "Error"
            );

            break;


        case "assemblyai_event":
            /*
             * Useful for debugging events that are not explicitly
             * mapped by the FastAPI session layer.
             */
            console.debug(
                "AssemblyAI event:",
                event.event
            );

            break;


        default:
            console.debug(
                "Unhandled event:",
                event
            );
    }
}


/* ============================================================
 * Start
 * ============================================================ */

async function startSession() {
    if (
        websocket &&
        websocket.readyState === WebSocket.OPEN
    ) {
        return;
    }

    clearTranscript();

    flushPlayback();

    sessionReady = false;

    try {
        await ensureAudioContext();

        await connectWebSocket();
    } catch (error) {
        console.error(
            "Failed to start:",
            error
        );

        stopMicrophone();

        if (websocket) {
            try {
                websocket.close();
            } catch (_) {}

            websocket = null;
        }

        setStatus(
            "Failed to connect",
            "error"
        );

        setAgentState(
            "Error"
        );
    }
}


/* ============================================================
 * Stop
 * ============================================================ */

function stopSession() {
    sessionReady = false;

    stopMicrophone();

    flushPlayback();

    if (
        websocket &&
        websocket.readyState === WebSocket.OPEN
    ) {
        try {
            websocket.send(
                JSON.stringify({
                    type: "end"
                })
            );
        } catch (_) {}

        try {
            websocket.close(1000);
        } catch (_) {}
    }

    websocket = null;

    startButton.disabled = false;
    stopButton.disabled = true;
    interruptButton.disabled = true;

    setAgentState("Idle");
    setStatus("Disconnected");

    connectionStateElement.textContent =
        "Disconnected";
}


/* ============================================================
 * Interrupt / barge-in
 * ============================================================ */

function interruptAgent() {
    flushPlayback();

    if (
        websocket &&
        websocket.readyState === WebSocket.OPEN
    ) {
        websocket.send(
            JSON.stringify({
                type: "interrupt"
            })
        );
    }

    setAgentState(
        "Listening"
    );

    setStatus(
        "Listening",
        "recording"
    );
}


/* ============================================================
 * Buttons
 * ============================================================ */

startButton.addEventListener(
    "click",
    async function() {
        await startSession();
    }
);

stopButton.addEventListener(
    "click",
    function() {
        stopSession();
    }
);

interruptButton.addEventListener(
    "click",
    function() {
        interruptAgent();
    }
);


/* ============================================================
 * Page lifecycle
 * ============================================================ */

window.addEventListener(
    "beforeunload",
    function() {
        stopMicrophone();
        flushPlayback();

        if (websocket) {
            try {
                websocket.close();
            } catch (_) {}
        }
    }
);


/* ============================================================
 * Initial state
 * ============================================================ */

setStatus("Disconnected");
setAgentState("Idle");

console.log(
    "Voice Agent client initialized."
);

console.log(
    `Target audio format: ${SAMPLE_RATE} Hz, PCM16 mono`
);
</script>
